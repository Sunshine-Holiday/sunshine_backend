name: Deploy Backend

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js for Backend
      - name: Set up Node.js for Backend
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Deploy Backend via SSH
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSHKEY }}
          port: 22
          script: |
            # Navigate to the backend directory
            cd /root/sunshine_backend
            
            # Pull the latest changes from the repository
            git pull origin main
            
            # Install backend dependencies
            npm install
            
            # Check if the backend is already running, stop it if it is
            pm2 list | grep node-app
            if [ $? -eq 0 ]; then
              pm2 restart node-app  # Restart the app if it's already running
            else
              pm2 start node-app   # Start the app if it's not running
            fi
